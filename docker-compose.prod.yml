services:
  postgres:
    image: postgres:16-alpine
    container_name: assessoria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assessoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altere-esta-senha-no-env}
      POSTGRES_DB: assessoria_cobrancas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assessoria} -d assessoria_cobrancas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: assessoria-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-38472}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-assessoria}:${POSTGRES_PASSWORD}@postgres:5432/assessoria_cobrancas
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ./data:/app/data:ro

volumes:
  postgres_data:
