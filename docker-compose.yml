services:
  postgres:
    image: postgres:16-alpine
    container_name: assessoria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assessoria
      POSTGRES_PASSWORD: assessoria
      POSTGRES_DB: assessoria_cobrancas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessoria -d assessoria_cobrancas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
