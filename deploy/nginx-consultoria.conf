# Reverse proxy nginx para consultoria.redobrai.online
# App Docker exposta em localhost:38472 (APP_PORT=38472 no .env, sem overlay Caddy)
#
# Instalação na VPS:
#   sudo cp deploy/nginx-consultoria.conf /etc/nginx/sites-available/consultoria.redobrai.online
#   sudo ln -sf /etc/nginx/sites-available/consultoria.redobrai.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d consultoria.redobrai.online

server {
    listen 80;
    listen [::]:80;
    server_name consultoria.redobrai.online;

    location / {
        proxy_pass http://127.0.0.1:38472;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
