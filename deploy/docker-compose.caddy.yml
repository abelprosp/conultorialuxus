# Overlay para HTTPS com Caddy.
# Uso: docker compose -f docker-compose.prod.yml -f deploy/docker-compose.caddy.yml up -d --build
services:
  app:
    ports: !reset []
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    container_name: assessoria-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
